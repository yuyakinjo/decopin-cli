name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      API_KEY: test-api-key-for-github-actions
      NODE_ENV: test
      PORT: 3000
      DEBUG: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: ./.github/actions/setup

      - name: Run Oxlint
        run: bun run lint

      - name: Check formatting with Oxfmt
        run: bun run format:check

      - name: Build project
        run: bun run build

      - name: Build example app
        run: bun run build:app

      - name: Generate CLI
        run: bun run dev:regen

      - name: Run tests
        id: test
        run: |
          bun test 2>&1 | tee test-output.log
          echo "test_exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # テスト結果をGitHub Summaryに追加
      - name: Generate test summary
        if: always()
        run: |
          {
            echo "## Test Results 🧪"
            echo ""

            if [ "${{ steps.test.outputs.test_exit_code }}" == "0" ]; then
              echo "✅ All tests passed!"
            else
              echo "❌ Some tests failed"
            fi

            echo ""
            echo "### Test Output"
            echo '```'
            tail -n 50 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail the job if tests failed
          if [ "${{ steps.test.outputs.test_exit_code }}" != "0" ]; then
            exit 1
          fi

  # Job to check if all required checks passed
  all-checks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
