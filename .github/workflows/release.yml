name: release

# タグを打ったら公開する。タグと package.json の version が一致しなければ落とす
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release を作る
      id-token: write # npm の Trusted Publishing (OIDC) に必要
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # provenance を付けるために npm CLI を使う (ビルドとテストは bun)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # タグと version の食い違いは、公開してから気づくと戻せない
      - name: check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json $version" >&2
            exit 1
          fi

      - run: bun run ci

      - run: bun run build:package

      # Trusted Publishing (OIDC) を使うので NPM_TOKEN は要らない
      - name: publish
        run: npm publish --provenance --access public
        working-directory: publish

      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
